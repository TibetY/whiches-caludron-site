<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop dashboard on a phone — Today’s brew</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&amp;family=Nunito:ital,wght@0,400..900;1,400..900&amp;display=swap">
<style>
body{margin:0;background:#FCF6EC}
a{color:#7C2A6C}a:hover{color:#26121F}
input,textarea,select,button{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:#8A6F82}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid #2EC4CE;outline-offset:2px}
.tx-cream{background-color:#FCF6EC;background-image:url(/_blob/860f97b01752ad1d29fee55a04c27b38);background-size:512px 512px}
</style>
</helmet>
<div class="tx-cream" style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Nunito, 'Trebuchet MS', sans-serif; color: #26121F; display: flex; flex-direction: column">
  <header style="flex: none; background: #5E2159; color: #FFF8EF; padding: 16px 16px 14px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid #26121F">
    <img src="/_blob/3f6d1ae5a323ef01495b7d89532b01dd" alt="" width="44" height="53" style="display: block; width: 44px; height: auto; transform: rotate(-5deg)">
    <div style="min-width: 0; flex: 1">
      <div style="font-family: Chewy, 'Comic Sans MS', cursive; font-weight: 400; font-size: 25px; line-height: 1.05; text-shadow: 1.5px 0 0 #26121F, -1.5px 0 0 #26121F, 0 1.5px 0 #26121F, 0 -1.5px 0 #26121F, 1px 1px 0 #26121F, -1px -1px 0 #26121F, 1px -1px 0 #26121F, -1px 1px 0 #26121F, 2px 2px 0 #26121F">Today’s brew</div>
      <div style="font-size: 13px; font-weight: 800; color: #F6E6F3">{{dateLabel}}</div>
    </div>
    <span role="status" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 2px solid #26121F; background: {{statusBg}}; color: #26121F; font-weight: 800; font-size: 12px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #26121F; background: {{statusDot}}"></span>{{statusText}}</span>
  </header>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="display: flex; align-items: center; gap: 10px; background: #D9F2B3; border: 3px solid #26121F; border-radius: 14px; padding: 10px 12px; font-weight: 800; font-size: 15px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#26121F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Published! It’s live on the website.</div>
    </sc-if>
    <section aria-labelledby="p-soup-h" style="box-sizing: border-box; background: #FFFFFF; border: 3px solid #26121F; border-radius: 20px; box-shadow: 0 4px 0 #26121F; padding: 22px 24px 24px; padding: 16px 16px 18px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <h2 id="p-soup-h" style="margin: 0; display: flex; align-items: center; gap: 12px; font-family: Chewy, 'Comic Sans MS', cursive; font-weight: 400; font-size: 29px; line-height: 1.1; color: #26121F; font-size: 25px"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9E4C92" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M3 11h18"></path><path d="M4 11c0 5 4 8 8 8s8-3 8-8"></path><path d="M9 7.5c0-1.5 1.5-1.5 1.5-3M13.5 7.5c0-1.5 1.5-1.5 1.5-3"></path></svg>Soup</h2>
        <button type="button" role="switch" aria-checked="{{sw.soupSoldOut.aria}}" aria-label="Soup sold out" onClick="{{sw.soupSoldOut.toggle}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 2px; background: none; border: none; cursor: pointer; font-weight: 800; font-size: 15px; color: #26121F"><span aria-hidden="true" style="position: relative; display: inline-block; flex: none; width: 54px; height: 30px; box-sizing: border-box; border-radius: 999px; border: 2.5px solid #26121F; background: {{sw.soupSoldOut.track}}"><span style="position: absolute; top: 2px; left: {{sw.soupSoldOut.knob}}; width: 21px; height: 21px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2px solid #26121F"></span></span>Sold out</button>
      </div>
      <label for="p-soup" style="display: block; margin: 16px 0 6px; font-weight: 800; font-size: 15px; color: #5A3550; margin-top: 8px">Soup of the day</label>
      <input id="p-soup" type="text" value="{{soup}}" onChange="{{onSoup}}" placeholder="e.g. Potato Parmesan Maple" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border: 2.5px solid #26121F; border-radius: 12px; background: #FFFFFF; font-size: 17px; line-height: 1.3">
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px">
        <sc-for list="{{soupPicks}}" as="p" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 8px 16px; border-radius: 999px; border: 2.5px solid #26121F; font-weight: 800; font-size: 15.5px; color: #26121F; cursor: pointer; font-size: 14.5px; padding: 8px 13px; background: {{p.bg}}">{{p.name}}</button>
        </sc-for>
      </div>
    </section>
    <section aria-labelledby="p-sammie-h" style="box-sizing: border-box; background: #FFFFFF; border: 3px solid #26121F; border-radius: 20px; box-shadow: 0 4px 0 #26121F; padding: 22px 24px 24px; padding: 16px 16px 18px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <h2 id="p-sammie-h" style="margin: 0; display: flex; align-items: center; gap: 12px; font-family: Chewy, 'Comic Sans MS', cursive; font-weight: 400; font-size: 29px; line-height: 1.1; color: #26121F; font-size: 25px"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9E4C92" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M3 10L12 4l9 6z"></path><path d="M3 13c3 1.5 6 1.5 9 0s6-1.5 9 0"></path><path d="M3 16h18v3H3z"></path></svg>Sammie</h2>
        <button type="button" role="switch" aria-checked="{{sw.sammieSoldOut.aria}}" aria-label="Sammie sold out" onClick="{{sw.sammieSoldOut.toggle}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 2px; background: none; border: none; cursor: pointer; font-weight: 800; font-size: 15px; color: #26121F"><span aria-hidden="true" style="position: relative; display: inline-block; flex: none; width: 54px; height: 30px; box-sizing: border-box; border-radius: 999px; border: 2.5px solid #26121F; background: {{sw.sammieSoldOut.track}}"><span style="position: absolute; top: 2px; left: {{sw.sammieSoldOut.knob}}; width: 21px; height: 21px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2px solid #26121F"></span></span>Sold out</button>
      </div>
      <label for="p-sammie" style="display: block; margin: 16px 0 6px; font-weight: 800; font-size: 15px; color: #5A3550; margin-top: 8px">Sammie of the day</label>
      <input id="p-sammie" type="text" value="{{sammie}}" onChange="{{onSammie}}" placeholder="e.g. The Trucker" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border: 2.5px solid #26121F; border-radius: 12px; background: #FFFFFF; font-size: 17px; line-height: 1.3">
      <label for="p-price" style="display: block; margin: 16px 0 6px; font-weight: 800; font-size: 15px; color: #5A3550">Price</label>
      <div style="display: flex; align-items: center; width: 150px; box-sizing: border-box; border: 2.5px solid #26121F; border-radius: 12px; background: #FFFFFF"><span aria-hidden="true" style="padding-left: 13px; font-weight: 800; font-size: 17px">$</span><input id="p-price" inputmode="decimal" value="{{sammiePrice}}" onChange="{{onSammiePrice}}" placeholder="0.00" style="box-sizing: border-box; width: 100%; min-width: 0; padding: 11px 12px 11px 5px; border: none; border-radius: 12px; background: transparent; font-size: 17px"></div>
    </section>
    <section aria-labelledby="p-till-h" style="box-sizing: border-box; background: #FFFFFF; border: 3px solid #26121F; border-radius: 20px; box-shadow: 0 4px 0 #26121F; padding: 22px 24px 24px; padding: 16px 16px 18px">
      <h2 id="p-till-h" style="margin: 0; display: flex; align-items: center; gap: 12px; font-family: Chewy, 'Comic Sans MS', cursive; font-weight: 400; font-size: 29px; line-height: 1.1; color: #26121F; font-size: 25px"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9E4C92" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4.5"></circle></svg>By the till</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px">
        <sc-for list="{{treats}}" as="t" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.toggle}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 8px 16px; border-radius: 999px; border: 2.5px solid #26121F; font-weight: 800; font-size: 15.5px; color: #26121F; cursor: pointer; font-size: 14.5px; padding: 8px 13px; background: {{t.bg}}">
            <sc-if value="{{t.on}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26121F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
            <sc-if value="{{t.off}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26121F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 5v14M5 12h14"></path></svg></sc-if>
            {{t.name}}
          </button>
        </sc-for>
      </div>
    </section>
    <section aria-labelledby="p-door-h" style="box-sizing: border-box; background: #FFFFFF; border: 3px solid #26121F; border-radius: 20px; box-shadow: 0 4px 0 #26121F; padding: 22px 24px 24px; padding: 16px 16px 18px">
      <h2 id="p-door-h" style="margin: 0; display: flex; align-items: center; gap: 12px; font-family: Chewy, 'Comic Sans MS', cursive; font-weight: 400; font-size: 29px; line-height: 1.1; color: #26121F; font-size: 25px"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9E4C92" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17"></path><path d="M4 21h16"></path><circle cx="14.5" cy="12" r="1"></circle></svg>Door sign</h2>
      <div role="radiogroup" aria-labelledby="p-door-h" style="display: flex; margin-top: 10px; border: 2.5px solid #26121F; border-radius: 14px; overflow: hidden">
        <sc-for list="{{doorOpts}}" as="o" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="flex: 1 1 0; min-height: 48px; padding: 8px 4px; border: none; border-left: {{o.sep}}; background: {{o.bg}}; color: {{o.fg}}; font-weight: 800; font-size: 14.5px; cursor: pointer">{{o.label}}</button>
        </sc-for>
      </div>
      <p style="margin: 6px 0 0; font-size: 14.5px; line-height: 1.45; color: #6B4A61; margin-top: 8px">{{doorHelp}}</p>
    </section>
  </div>
  <div style="flex: none; padding: 12px 16px 18px; background: #FCF6EC; border-top: 3px solid #26121F">
    <button type="button" onClick="{{publish}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; box-sizing: border-box; font-family: Chewy, 'Comic Sans MS', cursive; font-weight: 400; font-size: 22px; padding: 8px 22px; border: 3px solid #26121F; border-radius: 14px; box-shadow: 0 4px 0 #26121F; cursor: pointer; text-decoration: none; color: #FFF8EF; background: #9E4C92; width: 100%; font-size: 24px">Publish changes</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      soup: 'Potato Parmesan Maple',
      soupDesc: '',
      sammie: 'The Trucker',
      sammieDesc: 'Deli meats, mozzarella, rosemary mayo, pickled eggplant, kettle chips & greens',
      sammiePrice: '',
      s: { soupSoldOut: false, sammieSoldOut: false },
      treats: [
        { name: 'Butter tarts', on: true },
        { name: 'Cookies', on: true },
        { name: 'Biscuits', on: false }
      ],
      newTreat: '',
      door: 'auto',
      note: '',
      photos: {},
      dirty: false,
      toast: false
    };
  }

  change(patch) {
    this.setState(Object.assign({}, patch, { dirty: true, toast: false }));
  }
  fieldHandlers() {
    const on = {};
    Object.keys(this.state.f).forEach((k) => {
      on[k] = (e) => this.change({ f: Object.assign({}, this.state.f, { [k]: e.target.value }) });
    });
    return on;
  }
  switches() {
    const sw = {};
    Object.keys(this.state.s).forEach((k) => {
      const v = !!this.state.s[k];
      sw[k] = {
        on: v,
        off: !v,
        openWord: v ? 'Open' : 'Closed',
        aria: v ? 'true' : 'false',
        track: v ? '#9E4C92' : '#E9DCE6',
        knob: v ? '26px' : '2px',
        chip: v ? '#83EDF8' : '#FFFFFF',
        word: v ? 'Showing' : 'Hidden',
        toggle: () => this.change({ s: Object.assign({}, this.state.s, { [k]: !this.state.s[k] }) })
      };
    });
    return sw;
  }
  statusVals(toastText, toastHref) {
    const dirty = this.state.dirty;
    return {
      statusText: dirty ? 'Changes not published yet' : 'Live on the website',
      statusBg: dirty ? '#FFE7A8' : '#D9F2B3',
      statusDot: dirty ? '#F7941D' : '#3F7A17',
      toast: this.state.toast,
      toastText: toastText,
      toastHref: toastHref,
      publish: () => this.setState({ dirty: false, toast: true })
    };
  }
  photoPicker(key) {
    return (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const photos = Object.assign({}, this.state.photos, { [key]: { url: URL.createObjectURL(file), name: file.name } });
      this.change({ photos });
    };
  }

  renderVals() {
    const st = this.state;
    const field = (k) => (e) => this.change({ [k]: e.target.value });
    const sw = this.switches();
    const favourites = ['Potato Parmesan Maple', 'Cream of Cauliflower Three-Cheese', 'Tomato'];
    const soupPicks = favourites.map((name) => {
      const sel = st.soup.trim().toLowerCase() === name.toLowerCase();
      return { name: name, pressed: sel ? 'true' : 'false', bg: sel ? '#83EDF8' : '#FFFFFF', pick: () => this.change({ soup: name }) };
    });
    const treats = st.treats.map((t, i) => ({
      name: t.name, on: t.on, off: !t.on,
      pressed: t.on ? 'true' : 'false',
      bg: t.on ? '#B8E06A' : '#FFFFFF',
      toggle: () => this.change({ treats: this.state.treats.map((x, j) => (j === i ? Object.assign({}, x, { on: !x.on }) : x)) })
    }));
    const addTreat = () => {
      const n = (this.state.newTreat || '').trim();
      if (!n) return;
      this.change({ treats: this.state.treats.concat([{ name: n, on: true }]), newTreat: '' });
    };
    const doorChoices = [['auto', 'Automatic'], ['open', 'Open now'], ['closed', 'Closed now']];
    const doorOpts = doorChoices.map((c, i) => {
      const sel = st.door === c[0];
      return { label: c[1], checked: sel ? 'true' : 'false', bg: sel ? '#9E4C92' : '#FFFFFF', fg: sel ? '#FFF8EF' : '#26121F',
        sep: i === 0 ? 'none' : '2.5px solid #26121F', pick: () => this.change({ door: c[0] }) };
    });

    // regular hours in Toronto time; Fridays break from 2:30 to 4:30
    const hours = { Tue: [[11, 16]], Wed: [[11, 16]], Thu: [[11, 16]], Fri: [[11, 14.5], [16.5, 19]], Sat: [[11, 16]] };
    const order = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const names = { Sun: 'Sunday', Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday' };
    const fmt = (h) => {
      const hh = Math.floor(h);
      const mm = Math.round((h - hh) * 60);
      const h12 = hh > 12 ? hh - 12 : hh;
      return h12 + (mm ? ':' + (mm < 10 ? '0' + mm : mm) : '') + (hh >= 12 ? ' pm' : ' am');
    };
    let day = 'Tue';
    let hour = 12;
    let dateLabel = '';
    try {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Toronto', weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(now);
      const get = (t) => { const p = parts.find((x) => x.type === t); return p ? p.value : ''; };
      day = get('weekday') || day;
      hour = (parseInt(get('hour'), 10) % 24) + (parseInt(get('minute'), 10) || 0) / 60;
      dateLabel = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Toronto', weekday: 'long', month: 'long', day: 'numeric' }).format(now);
    } catch (e) {}
    const today = hours[day] || [];
    const current = today.find((w) => hour >= w[0] && hour < w[1]);
    const later = today.find((w) => hour < w[0]);
    let open = !!current;
    if (st.door === 'open') open = true;
    if (st.door === 'closed') open = false;
    let signNote = '';
    if (st.door !== 'auto') {
      signNote = 'until you switch it back';
    } else if (open) {
      signNote = 'until ' + fmt(current[1]);
    } else if (later) {
      signNote = (later === today[0] ? 'opening' : 'back') + ' today at ' + fmt(later[0]);
    } else {
      const idx = order.indexOf(day);
      for (let i = 1; i <= 7; i++) {
        const d = order[(idx + i) % 7];
        if (hours[d]) { signNote = 'back ' + (i === 1 ? 'tomorrow' : names[d]) + ' at ' + fmt(hours[d][0][0]); break; }
      }
    }
    const signWord = open ? 'OPEN' : 'CLOSED';
    const doorHelp = st.door === 'auto'
      ? 'Right now the sign on the website says ' + signWord + ' (' + signNote + ').'
      : 'The sign stays ' + signWord + ' until you set it back to Automatic.';

    const onCounter = st.treats.filter((t) => t.on).map((t) => t.name.toLowerCase());
    const tillShown = onCounter.length === 0 ? 'nothing today'
      : (onCounter.length === 1 ? onCounter[0] : onCounter.slice(0, -1).join(', ') + ' & ' + onCounter[onCounter.length - 1]);
    const greet = hour < 12 ? 'Good morning' : (hour < 17 ? 'Good afternoon' : 'Good evening');
    const photo = st.photos.day;
    const price = (st.sammiePrice || '').trim().replace(/^\$/, '');

    return Object.assign({
      dateLabel: dateLabel,
      greeting: greet,
      soup: st.soup, onSoup: field('soup'),
      soupDesc: st.soupDesc, onSoupDesc: field('soupDesc'),
      sammie: st.sammie, onSammie: field('sammie'),
      sammieDesc: st.sammieDesc, onSammieDesc: field('sammieDesc'),
      sammiePrice: st.sammiePrice, onSammiePrice: field('sammiePrice'),
      newTreat: st.newTreat, onNewTreat: field('newTreat'), addTreat: addTreat,
      note: st.note, onNote: field('note'), hasNote: !!st.note.trim(),
      sw: sw, soupPicks: soupPicks, treats: treats, doorOpts: doorOpts, doorHelp: doorHelp,
      signWord: signWord, signNote: signNote, signColor: open ? '#3F7A17' : '#C42222',
      soupShown: st.soup.trim() || '[today’s soup]',
      soupDeco: st.s.soupSoldOut ? 'line-through' : 'none',
      soupSoldOut: st.s.soupSoldOut,
      hasSoupDesc: !!st.soupDesc.trim(),
      sammieShown: st.sammie.trim() || '[today’s sammie]',
      sammieDeco: st.s.sammieSoldOut ? 'line-through' : 'none',
      sammieSoldOut: st.s.sammieSoldOut,
      hasSammieDesc: !!st.sammieDesc.trim(),
      priceShown: price ? '$' + price : '[price]',
      tillShown: tillShown,
      hasPhoto: !!photo, noPhoto: !photo,
      photoUrl: photo ? photo.url : '', photoName: photo ? photo.name : '',
      onPhoto: this.photoPicker('day'),
      removePhoto: () => this.change({ photos: Object.assign({}, this.state.photos, { day: null }) })
    }, this.statusVals('Published! Today’s brew is live on the website.', 'Main.dc.html'));
  }
}
</script>
</body>
</html>
